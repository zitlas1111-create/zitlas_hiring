<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>Admin — Expert Applications · ZITLAS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --brand:    #FF7A00;
      --bg:       #f0f2f5;
      --surface:  #ffffff;
      --s2:       #f8fafc;
      --text-1:   #0f172a;
      --text-2:   #475569;
      --text-3:   #94a3b8;
      --border:   #e8edf3;
      --shadow:   0 1px 4px rgba(0,0,0,0.07), 0 0 0 1px rgba(0,0,0,0.04);
      --r:        12px;
      --font:     'Inter', sans-serif;
      --green:    #16a34a;
      --red:      #dc2626;
      --amber:    #d97706;
    }
    [data-theme="dark"] {
      --bg:       #0d1117;
      --surface:  #161b22;
      --s2:       #21262d;
      --text-1:   #f0f6fc;
      --text-2:   #8b949e;
      --text-3:   #6e7681;
      --border:   #30363d;
      --shadow:   0 1px 4px rgba(0,0,0,0.3), 0 0 0 1px rgba(255,255,255,0.04);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-family: var(--font); -webkit-text-size-adjust: 100%; }
    body { background: var(--bg); min-height: 100vh; color: var(--text-1); }
    a { text-decoration: none; }
    button { cursor: pointer; font-family: inherit; border: none; }

    /* ── Shell ──────────────────────────────────────────── */
    .app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; position: relative; }

    /* ── Header ─────────────────────────────────────────── */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .logo { font-size: 17px; font-weight: 900; color: var(--text-1); letter-spacing: -0.03em; }
    .logo span { color: var(--brand); }
    .header-badge {
      padding: 2px 8px;
      background: #fff0e0;
      color: #c05500;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
    }
    [data-theme="dark"] .header-badge { background: rgba(255,122,0,0.15); color: var(--brand); }
    .header-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .theme-btn {
      width: 32px; height: 32px;
      border-radius: 8px;
      background: var(--s2);
      border: 1px solid var(--border);
      color: var(--text-2);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }
    .logout-btn {
      padding: 5px 12px;
      background: transparent;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-2);
    }
    .logout-btn:hover { border-color: var(--red); color: var(--red); }

    /* ── Main ───────────────────────────────────────────── */
    .main { flex: 1; padding: 0 12px 32px; overflow-y: auto; }

    /* ── Stats Row ──────────────────────────────────────── */
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 16px 0 12px; }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 10px 8px;
      text-align: center;
    }
    .stat-val { font-size: 20px; font-weight: 800; color: var(--text-1); line-height: 1; }
    .stat-lbl { font-size: 10px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 4px; }
    .stat-val.pending-color { color: var(--amber); }
    .stat-val.approved-color { color: var(--green); }
    .stat-val.rejected-color { color: var(--red); }

    /* ── Filter Tabs ────────────────────────────────────── */
    .filter-bar { display: flex; gap: 6px; padding: 0 0 12px; overflow-x: auto; scrollbar-width: none; }
    .filter-bar::-webkit-scrollbar { display: none; }
    .filter-tab {
      flex-shrink: 0;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text-2);
      transition: all 0.15s;
    }
    .filter-tab.active { background: var(--brand); border-color: var(--brand); color: #0f172a; }
    .filter-tab:hover:not(.active) { border-color: var(--brand); color: var(--brand); }

    /* ── Section Title ──────────────────────────────────── */
    .section-hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 0 10px;
    }
    .section-title { font-size: 13px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.05em; }
    .result-count { font-size: 12px; font-weight: 600; color: var(--text-3); }

    /* ── Application Card ───────────────────────────────── */
    .app-list { display: flex; flex-direction: column; gap: 10px; }
    .app-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 14px;
      cursor: pointer;
      transition: box-shadow 0.15s, border-color 0.15s;
    }
    .app-card:hover { box-shadow: var(--shadow); border-color: var(--brand); }
    .card-top { display: flex; align-items: flex-start; gap: 10px; }
    .avatar {
      width: 40px; height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, #FF7A00, #ffb347);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      font-weight: 800;
      color: #0f172a;
      flex-shrink: 0;
      text-transform: uppercase;
    }
    .card-info { flex: 1; min-width: 0; }
    .card-name { font-size: 15px; font-weight: 700; color: var(--text-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-meta { font-size: 12.5px; color: var(--text-2); margin-top: 2px; }
    .status-badge {
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
      margin-left: auto;
    }
    .badge-pending  { background: #fff7ed; color: #c2410c; }
    .badge-approved { background: #f0fdf4; color: #15803d; }
    .badge-rejected { background: #fef2f2; color: #b91c1c; }
    [data-theme="dark"] .badge-pending  { background: rgba(255,122,0,0.12); color: #fb923c; }
    [data-theme="dark"] .badge-approved { background: rgba(22,163,74,0.12);  color: #4ade80; }
    [data-theme="dark"] .badge-rejected { background: rgba(220,38,38,0.12);  color: #f87171; }

    .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
    .type-pill {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
    }
    .pill-nutritionist { background: #f0fdf4; color: #15803d; }
    .pill-fitness_trainer { background: #fff7ed; color: #c2410c; }
    .pill-both { background: #eff6ff; color: #1d4ed8; }
    .pill-other { background: var(--s2); color: var(--text-2); }
    [data-theme="dark"] .pill-nutritionist { background: rgba(22,163,74,0.12);  color: #4ade80; }
    [data-theme="dark"] .pill-fitness_trainer { background: rgba(255,122,0,0.12); color: #fb923c; }
    [data-theme="dark"] .pill-both { background: rgba(29,78,216,0.15); color: #93c5fd; }
    .card-date { font-size: 11px; color: var(--text-3); }

    /* ── Empty State ─────────────────────────────────────── */
    .empty { text-align: center; padding: 48px 24px; }
    .empty-icon { font-size: 40px; margin-bottom: 12px; }
    .empty-title { font-size: 16px; font-weight: 700; color: var(--text-1); margin-bottom: 6px; }
    .empty-sub { font-size: 13.5px; color: var(--text-2); }

    /* ── Loader ─────────────────────────────────────────── */
    .spinner { display: flex; justify-content: center; padding: 40px 0; }
    .spin { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--brand); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Modal Overlay ──────────────────────────────────── */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 100;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface);
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px 20px 40px;
      animation: slide-up 0.25s cubic-bezier(0.4,0,0.2,1);
    }
    @keyframes slide-up { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    .modal-handle { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 18px; }
    .modal-close {
      position: absolute; top: 16px; right: 16px;
      width: 30px; height: 30px;
      border-radius: 8px;
      background: var(--s2);
      border: 1px solid var(--border);
      color: var(--text-2);
      font-size: 16px;
      display: flex; align-items: center; justify-content: center;
    }
    .modal-name { font-size: 18px; font-weight: 800; color: var(--text-1); margin-bottom: 4px; }
    .modal-sub  { font-size: 13px; color: var(--text-2); margin-bottom: 16px; }

    .detail-section { margin-bottom: 16px; }
    .detail-label { font-size: 11px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .detail-field { background: var(--s2); border-radius: 8px; padding: 10px; }
    .detail-field-label { font-size: 10px; font-weight: 600; color: var(--text-3); text-transform: uppercase; margin-bottom: 3px; }
    .detail-field-value { font-size: 13.5px; font-weight: 600; color: var(--text-1); word-break: break-all; }
    .detail-field-value.muted { color: var(--text-3); font-weight: 400; }

    .form-data-box {
      background: var(--s2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font-size: 12px;
      color: var(--text-2);
      font-family: monospace;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 200px;
      overflow-y: auto;
    }

    /* ── Modal Actions ──────────────────────────────────── */
    .modal-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
    .btn-approve, .btn-reject, .btn-close {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      height: 50px; border-radius: 12px; font-size: 15px; font-weight: 700;
      transition: opacity 0.15s, transform 0.1s;
      width: 100%;
    }
    .btn-approve { background: var(--green); color: #fff; }
    .btn-reject  { background: var(--red);   color: #fff; }
    .btn-close   { background: var(--s2); border: 1.5px solid var(--border); color: var(--text-2); }
    .btn-approve:active, .btn-reject:active, .btn-close:active { opacity: 0.85; transform: scale(0.99); }
    .btn-approve:disabled, .btn-reject:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ── Reject Reason Input ─────────────────────────────── */
    .reject-form { display: none; margin-top: 12px; }
    .reject-form.visible { display: block; }
    .reject-textarea {
      width: 100%; min-height: 90px; border: 1.5px solid var(--border);
      border-radius: 10px; padding: 12px; font-size: 14px; font-family: inherit;
      color: var(--text-1); background: var(--s2); resize: vertical;
    }
    .reject-textarea:focus { outline: none; border-color: var(--red); }
    .btn-confirm-reject {
      display: flex; align-items: center; justify-content: center;
      width: 100%; height: 46px; margin-top: 8px; border-radius: 10px;
      background: var(--red); color: #fff; font-size: 14px; font-weight: 700;
      transition: opacity 0.15s;
    }
    .btn-confirm-reject:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ── Toast ──────────────────────────────────────────── */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: #0f172a; color: #fff; padding: 10px 20px; border-radius: 20px;
      font-size: 13.5px; font-weight: 600; z-index: 200;
      transition: transform 0.3s cubic-bezier(0.4,0,0.2,1), opacity 0.3s;
      opacity: 0; pointer-events: none; white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast.success { background: var(--green); }
    .toast.error   { background: var(--red); }
    [data-theme="dark"] .toast { background: #f0f6fc; color: #0f172a; }

    /* ── Auth screen ─────────────────────────────────────── */
    .auth-screen {
      position: fixed; inset: 0;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      z-index: 50; flex-direction: column; gap: 16px; padding: 24px;
    }
    .auth-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
      padding: 28px 24px; width: 100%; max-width: 360px; text-align: center;
    }
    .auth-logo { font-size: 20px; font-weight: 900; color: var(--text-1); margin-bottom: 4px; }
    .auth-logo span { color: var(--brand); }
    .auth-sub { font-size: 13px; color: var(--text-2); margin-bottom: 24px; }
    .auth-msg { font-size: 14px; color: var(--red); background: #fef2f2; padding: 10px 14px; border-radius: 8px; }
    .auth-login-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 100%; height: 48px; background: var(--brand); border-radius: 12px;
      font-size: 15px; font-weight: 700; color: #0f172a; margin-top: 16px;
      text-decoration: none;
    }
  </style>
</head>
<body>

<!-- Admin-only guard screen (shown briefly while checking) -->
<div class="auth-screen" id="authScreen">
  <div class="auth-card">
    <div class="auth-logo">ZITL<span>A</span>S</div>
    <div class="auth-sub">Admin Dashboard</div>
    <div class="auth-msg" id="authMsg">Checking access…</div>
    <a href="/login.html" class="auth-login-btn" id="loginBtn" style="display:none;">Go to Login</a>
  </div>
</div>

<!-- Main App -->
<div class="app" id="mainApp" style="display:none;">

  <!-- Header -->
  <header class="header">
    <div class="logo">ZITL<span>A</span>S</div>
    <span class="header-badge">Admin</span>
    <div class="header-right">
      <button class="theme-btn" id="themeBtn" title="Toggle theme">☀</button>
      <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>
  </header>

  <!-- Main content -->
  <main class="main">

    <!-- Stats -->
    <div class="stats" id="statsRow">
      <div class="stat-card"><div class="stat-val" id="statTotal">—</div><div class="stat-lbl">Total</div></div>
      <div class="stat-card"><div class="stat-val pending-color" id="statPending">—</div><div class="stat-lbl">Pending</div></div>
      <div class="stat-card"><div class="stat-val approved-color" id="statApproved">—</div><div class="stat-lbl">Approved</div></div>
      <div class="stat-card"><div class="stat-val rejected-color" id="statRejected">—</div><div class="stat-lbl">Rejected</div></div>
    </div>

    <!-- Filter -->
    <div class="filter-bar">
      <button class="filter-tab active" data-filter="all">All</button>
      <button class="filter-tab" data-filter="pending">Pending</button>
      <button class="filter-tab" data-filter="approved">Approved</button>
      <button class="filter-tab" data-filter="rejected">Rejected</button>
    </div>

    <!-- Section header -->
    <div class="section-hdr">
      <span class="section-title">Applications</span>
      <span class="result-count" id="resultCount">Loading…</span>
    </div>

    <!-- List -->
    <div class="app-list" id="appList">
      <div class="spinner"><div class="spin"></div></div>
    </div>

  </main>
</div>

<!-- ─ Detail Modal ─────────────────────────────────── -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <div class="modal-handle"></div>
    <button class="modal-close" id="modalClose">✕</button>

    <div class="modal-name" id="mName">—</div>
    <div class="modal-sub"  id="mSub">—</div>

    <!-- Contact -->
    <div class="detail-section">
      <div class="detail-label">Contact</div>
      <div class="detail-grid">
        <div class="detail-field"><div class="detail-field-label">Email</div><div class="detail-field-value" id="mEmail">—</div></div>
        <div class="detail-field"><div class="detail-field-label">Phone</div><div class="detail-field-value" id="mPhone">—</div></div>
      </div>
    </div>

    <!-- Application info -->
    <div class="detail-section">
      <div class="detail-label">Application Info</div>
      <div class="detail-grid">
        <div class="detail-field"><div class="detail-field-label">Expert Type</div><div class="detail-field-value" id="mType">—</div></div>
        <div class="detail-field"><div class="detail-field-label">Status</div><div class="detail-field-value" id="mStatus">—</div></div>
        <div class="detail-field"><div class="detail-field-label">Submitted</div><div class="detail-field-value" id="mSubmitted">—</div></div>
        <div class="detail-field"><div class="detail-field-label">Affiliate Ref</div><div class="detail-field-value muted" id="mRef">—</div></div>
      </div>
    </div>

    <!-- Existing notes if reviewed -->
    <div class="detail-section" id="reviewSection" style="display:none;">
      <div class="detail-label">Review Info</div>
      <div class="detail-grid">
        <div class="detail-field"><div class="detail-field-label">Reviewed At</div><div class="detail-field-value" id="mReviewedAt">—</div></div>
        <div class="detail-field"><div class="detail-field-label">Notes / Reason</div><div class="detail-field-value" id="mNotes">—</div></div>
      </div>
    </div>

    <!-- Form data -->
    <div class="detail-section" id="formDataSection">
      <div class="detail-label">Full Form Data</div>
      <div class="form-data-box" id="mFormData">Loading…</div>
    </div>

    <!-- Actions -->
    <div class="modal-actions" id="modalActions">
      <button class="btn-approve" id="btnApprove">✓ Approve Application</button>
      <button class="btn-reject"  id="btnRejectToggle">✕ Reject Application</button>

      <!-- Rejection reason form (shown on reject click) -->
      <div class="reject-form" id="rejectForm">
        <textarea class="reject-textarea" id="rejectReason" placeholder="Explain why this application is being rejected…"></textarea>
        <button class="btn-confirm-reject" id="btnConfirmReject">Confirm Rejection</button>
      </div>

      <button class="btn-close" id="btnCloseModal">Close</button>
    </div>

  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  /* ── Theme ───────────────────────────────────────────── */
  var theme = localStorage.getItem('zitlas_theme') || 'light';
  document.documentElement.setAttribute('data-theme', theme);
  var themeBtn = document.getElementById('themeBtn');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀' : '☾';
    themeBtn.addEventListener('click', function () {
      theme = theme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('zitlas_theme', theme);
      themeBtn.textContent = theme === 'dark' ? '☀' : '☾';
    });
  }

  /* ── Auth Guard ──────────────────────────────────────── */
  var token   = localStorage.getItem('zitlas_token');
  var session = {};
  try { session = JSON.parse(localStorage.getItem('zitlas_session') || '{}'); } catch(e) {}

  var authScreen = document.getElementById('authScreen');
  var mainApp    = document.getElementById('mainApp');
  var authMsg    = document.getElementById('authMsg');
  var loginBtn   = document.getElementById('loginBtn');

  function showAuthError(msg) {
    authMsg.textContent = msg;
    loginBtn.style.display = 'flex';
  }

  if (!token || !session.isLoggedIn) {
    showAuthError('Not authenticated. Please log in first.');
  } else if (session.role !== 'admin') {
    showAuthError('Access denied. This page is restricted to admins.');
  } else {
    authScreen.style.display  = 'none';
    mainApp.style.display     = 'flex';
    init();
  }

  /* ── Logout ──────────────────────────────────────────── */
  var logoutBtn = document.getElementById('logoutBtn');
  if (logoutBtn) {
    logoutBtn.addEventListener('click', function () {
      localStorage.removeItem('zitlas_token');
      localStorage.removeItem('zitlas_session');
      window.location.href = '/login.html';
    });
  }

  /* ── Toast ───────────────────────────────────────────── */
  var toastEl = document.getElementById('toast');
  var toastTimer;
  function showToast(msg, type) {
    toastEl.textContent = msg;
    toastEl.className = 'toast show' + (type ? ' ' + type : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.className = 'toast'; }, 3000);
  }

  /* ── API helpers ─────────────────────────────────────── */
  function api(method, path, body) {
    return fetch('/api/admin' + path, {
      method: method,
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + (localStorage.getItem('zitlas_token') || ''),
      },
      body: body ? JSON.stringify(body) : undefined,
    }).then(function (r) {
      if (!r.ok) return r.json().then(function (d) { throw new Error(d.detail || 'Request failed'); });
      return r.json();
    });
  }

  /* ── State ───────────────────────────────────────────── */
  var currentFilter  = 'all';
  var allApps        = [];
  var currentApp     = null;

  /* ── Init ────────────────────────────────────────────── */
  function init() {
    loadStats();
    loadApps();
    bindFilterTabs();
    bindModal();
  }

  /* ── Stats ───────────────────────────────────────────── */
  function loadStats() {
    api('GET', '/stats').then(function (d) {
      document.getElementById('statTotal').textContent    = d.total    || 0;
      document.getElementById('statPending').textContent  = d.pending  || 0;
      document.getElementById('statApproved').textContent = d.approved || 0;
      document.getElementById('statRejected').textContent = d.rejected || 0;
    }).catch(function () {});
  }

  /* ── Load applications ───────────────────────────────── */
  function loadApps() {
    var listEl = document.getElementById('appList');
    listEl.innerHTML = '<div class="spinner"><div class="spin"></div></div>';

    var qs = currentFilter !== 'all' ? '?status=' + currentFilter : '';
    api('GET', '/applications' + qs).then(function (apps) {
      allApps = apps;
      renderList(apps);
    }).catch(function (e) {
      listEl.innerHTML = '<div class="empty"><div class="empty-title">Failed to load</div><div class="empty-sub">' + e.message + '</div></div>';
    });
  }

  /* ── Render list ─────────────────────────────────────── */
  function renderList(apps) {
    var listEl  = document.getElementById('appList');
    var countEl = document.getElementById('resultCount');
    countEl.textContent = apps.length + ' result' + (apps.length !== 1 ? 's' : '');

    if (!apps.length) {
      listEl.innerHTML = '<div class="empty"><div class="empty-icon">📋</div><div class="empty-title">No applications</div><div class="empty-sub">No ' + (currentFilter !== 'all' ? currentFilter : '') + ' applications found.</div></div>';
      return;
    }

    listEl.innerHTML = '';
    apps.forEach(function (app) {
      var card = document.createElement('div');
      card.className = 'app-card';
      card.innerHTML = buildCard(app);
      card.addEventListener('click', function () { openModal(app.id); });
      listEl.appendChild(card);
    });
  }

  function buildCard(app) {
    var initial = (app.name || '?')[0].toUpperCase();
    var badgeClass = 'badge-' + (app.status || 'pending');
    var typeClass  = 'pill-' + (app.expert_type || 'other').replace(/ /g, '_');
    var typeLabel  = (app.expert_type || 'Unknown').replace(/_/g, ' ').replace(/\b\w/g, function(c){return c.toUpperCase();});
    var date       = app.submitted_at ? formatDate(app.submitted_at) : '—';

    return '<div class="card-top">' +
      '<div class="avatar">' + initial + '</div>' +
      '<div class="card-info">' +
        '<div class="card-name">' + esc(app.name) + '</div>' +
        '<div class="card-meta">' + esc(app.email || app.phone || '—') + '</div>' +
      '</div>' +
      '<span class="status-badge ' + badgeClass + '">' + (app.status || '—') + '</span>' +
    '</div>' +
    '<div class="card-footer">' +
      '<span class="type-pill ' + typeClass + '">' + typeLabel + '</span>' +
      '<span class="card-date">' + date + '</span>' +
    '</div>';
  }

  /* ── Filter tabs ─────────────────────────────────────── */
  function bindFilterTabs() {
    document.querySelectorAll('.filter-tab').forEach(function (tab) {
      tab.addEventListener('click', function () {
        document.querySelectorAll('.filter-tab').forEach(function (t) { t.classList.remove('active'); });
        tab.classList.add('active');
        currentFilter = tab.getAttribute('data-filter');
        loadApps();
      });
    });
  }

  /* ── Modal ───────────────────────────────────────────── */
  function bindModal() {
    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('btnCloseModal').addEventListener('click', closeModal);
    document.getElementById('modalOverlay').addEventListener('click', function (e) {
      if (e.target === this) closeModal();
    });
    document.getElementById('btnApprove').addEventListener('click', handleApprove);
    document.getElementById('btnRejectToggle').addEventListener('click', function () {
      var rf = document.getElementById('rejectForm');
      rf.classList.toggle('visible');
      this.textContent = rf.classList.contains('visible') ? '← Cancel' : '✕ Reject Application';
    });
    document.getElementById('btnConfirmReject').addEventListener('click', handleReject);
  }

  function openModal(appId) {
    document.getElementById('mFormData').textContent = 'Loading…';
    resetModalActions();

    // Find in cached list first
    var cached = allApps.find(function (a) { return a.id === appId; });
    if (cached) populateModal(cached);

    // Fetch full detail (includes form_data)
    api('GET', '/applications/' + appId).then(function (app) {
      currentApp = app;
      populateModal(app);
    }).catch(function (e) {
      document.getElementById('mFormData').textContent = 'Failed to load: ' + e.message;
    });

    document.getElementById('modalOverlay').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
    document.body.style.overflow = '';
    currentApp = null;
    resetModalActions();
  }

  function populateModal(app) {
    document.getElementById('mName').textContent = app.name || '—';
    var typeLabel = (app.expert_type || 'Unknown').replace(/_/g, ' ').replace(/\b\w/g, function(c){return c.toUpperCase();});
    document.getElementById('mSub').textContent = typeLabel + ' Application · ' + (app.status || '—').toUpperCase();
    document.getElementById('mEmail').textContent     = app.email || '—';
    document.getElementById('mPhone').textContent     = app.phone || '—';
    document.getElementById('mType').textContent      = typeLabel;
    document.getElementById('mStatus').textContent    = (app.status || '—');
    document.getElementById('mSubmitted').textContent = app.submitted_at ? formatDate(app.submitted_at) : '—';
    document.getElementById('mRef').textContent       = app.affiliate_ref || '—';

    // Review section
    var reviewSec = document.getElementById('reviewSection');
    if (app.reviewed_at) {
      reviewSec.style.display = 'block';
      document.getElementById('mReviewedAt').textContent = formatDate(app.reviewed_at);
      document.getElementById('mNotes').textContent      = app.approval_notes || '—';
    } else {
      reviewSec.style.display = 'none';
    }

    // Form data
    if (app.form_data) {
      document.getElementById('mFormData').textContent = JSON.stringify(app.form_data, null, 2);
    }

    // Show/hide action buttons based on status
    var actions = document.getElementById('modalActions');
    if (app.status === 'pending') {
      actions.style.display = 'flex';
    } else {
      actions.style.display = 'none';
    }
  }

  function resetModalActions() {
    document.getElementById('rejectForm').classList.remove('visible');
    document.getElementById('btnRejectToggle').textContent = '✕ Reject Application';
    document.getElementById('rejectReason').value = '';
    setActionsLoading(false);
  }

  function setActionsLoading(loading) {
    document.getElementById('btnApprove').disabled = loading;
    document.getElementById('btnRejectToggle').disabled = loading;
    document.getElementById('btnConfirmReject').disabled = loading;
  }

  function handleApprove() {
    if (!currentApp) return;
    setActionsLoading(true);
    api('POST', '/applications/' + currentApp.id + '/approve', {}).then(function (res) {
      showToast('Application approved! Setup email sent.', 'success');
      closeModal();
      loadStats();
      loadApps();
    }).catch(function (e) {
      showToast('Error: ' + e.message, 'error');
      setActionsLoading(false);
    });
  }

  function handleReject() {
    if (!currentApp) return;
    var reason = document.getElementById('rejectReason').value.trim();
    if (!reason) { showToast('Please enter a rejection reason'); return; }
    setActionsLoading(true);
    api('POST', '/applications/' + currentApp.id + '/reject', { reason: reason }).then(function () {
      showToast('Application rejected.', 'success');
      closeModal();
      loadStats();
      loadApps();
    }).catch(function (e) {
      showToast('Error: ' + e.message, 'error');
      setActionsLoading(false);
    });
  }

  /* ── Helpers ─────────────────────────────────────────── */
  function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function formatDate(iso) {
    try {
      var d = new Date(iso);
      return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' })
        + ' ' + d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
    } catch(e) { return iso; }
  }

})();
</script>
</body>
</html>
